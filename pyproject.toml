[build-system]
# Cap hatchling at 1.27.x: it emits core-metadata 2.4 (still carrying the SPDX
# License-Expression), which the twine bundled in pypa/gh-action-pypi-publish
# accepts. hatchling >= 1.28 emits metadata 2.5, which that twine rejects with
# "'2.5' is not a valid metadata version". Revisit when the publish action ships
# a twine that understands 2.5.
requires = ["hatchling>=1.27,<1.28", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "nmdc_lakehouse_schema"
description = "The NMDC flattened-schema product: the LinkML flat-schema generator, the schema-driven flattener that realises that shape, and a schema-diff tool. Consumed by the NMDC lakehouse ETL."
authors = [
  {name = "Sierra Moxon", email = "smoxon@lbl.gov"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pytest>=8.0",
    # Backs the schema-diff markdown-rendering tests (a real CommonMark parser).
    "markdown-it-py>=3.0",
    # Used by scripts/ (flattened-schema generation + flatten preview). Pinned: the shipped
    # nmdc_schema_flattened.yaml is a function of this exact source version, and consumers
    # (nmdc-lakehouse) must flatten with the same one — bump both repos together.
    "nmdc-schema==11.23.0",
    "pymongo>=4.9",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/nmdc_lakehouse_schema/_version.py",
    # Generated by `gen-python`; linting hand-edits would be overwritten on the next
    # regeneration. Excluded from codespell below for the same reason.
    "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema.py",
    "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema_pydantic.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema_pydantic.py",
  "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema_pydantic.py",
  "src/nmdc_lakehouse_schema/datamodel/nmdc_lakehouse_schema.py",
]
