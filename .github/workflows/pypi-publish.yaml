---
name: Publish Python Package

# Publishes to PyPI (only) with trusted publishing, on either:
# - a version tag push "v1.2.3" / "v1.2.3rcN", or
# - a GitHub Release marked published.
# skip-existing tolerates the case where both events fire for one version.
#
# More on trusted publishing: https://docs.pypi.org/trusted-publishers/

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      # GitHub glob matching is limited. So we can't define a pattern matching
      # pep 440 version definition [N!]N(.N)*[{a|b|rc}N][.postN][.devN]
      - 'v[0-9]+.[0-9]+.[0-9]+.?*'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]'
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build Python 🐍 distributions 📦 for publishing
    runs-on: ubuntu-latest
    # The workflow denies all scopes (permissions: {} above); grant this job the
    # contents:read that actions/checkout needs, or the clone fails with
    # "Repository not found" (this repo is private).
    permissions:
      contents: read

    strategy:
      matrix:
        pyversion: ["3.13"]

    steps:
      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: true

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Build source and wheel archives
        run: uv build

      # https://github.com/actions/upload-artifact
      - name: Store built distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution-files
          path: dist/

  pypi-publish:
    name: Publish Python 🐍 package 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/nmdc_lakehouse_schema
    permissions:
      id-token: write  # this permission is mandatory for trusted publishing
    steps:
      # https://github.com/actions/download-artifact
      - name: Download built distribution
        uses: actions/download-artifact@v8.0.1
        with:
          name: distribution-files
          path: dist

      # https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          skip-existing: true
          verbose: true
