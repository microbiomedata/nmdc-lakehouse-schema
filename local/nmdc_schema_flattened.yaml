        name: ctg_l90
        description: The L90 statistic is less than or equal to the L50 statistic;
          it is the length for which the collection of all contigs of that length
          or longer contains at least 90% of the sum of the lengths of all contigs..
          Polymorphic subclass-specific slot (from 'MetagenomeAssembly').
        range: float
        required: false
        multivalued: false
      ctg_logsum:
